<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ppaddict v2</title>
    <link rel="stylesheet" href="styles.css">
    <script src="htmx-2.0.10.min.js"></script>
    <script>
        htmx.defineExtension('postrangerequest', {
            onEvent: function (name, evt) {
                if (name === "htmx:configRequest") {
                    evt.detail.headers['Content-Type'] = "application/json"
                }
            },
            encodeParameters: function(xhr, parameters, elt) {
                let base = parameters.copy ? JSON.parse(JSON.stringify(window.__rangeRequest)) : window.__rangeRequest;
                delete parameters.copy

                Object.assign(base, parameters)
                return (JSON.stringify(base))
            }
        });
    </script>
</head>
<body>
    <h1>ppaddict+!r</h1>
    <div class="table-container" hx-get="/htmx/beatmaps/initial" hx-trigger="load">
        Loading beatmaps...
    </div>
</body>

</html>
