<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ppaddict v2</title>
    <link rel="stylesheet" href="styles.css">
    <script src="htmx-2.0.10.min.js"></script>
    <script>
        function rangeReq(obj) {
            var base = window.__rangeRequest;
            if (obj.copy) {
                base = JSON.parse(JSON.stringify(base));
                Object.assign(base, obj.copy)
            } else {
                Object.assign(base, obj.mod)
            }
            return JSON.stringify(base)
        }

        htmx.defineExtension('postrangerequest', {
            onEvent: function (name, evt) {
                if (name === "htmx:configRequest") {
                    evt.detail.headers['Content-Type'] = "application/json"
                }
            },
            encodeParameters: function(xhr, parameters, elt) {
                return parameters.json
            }
        });

        function modifyRule(selector, property, value) {
          for (const sheet of document.styleSheets) {
            for (const rule of sheet.cssRules) {
              if (rule.selectorText === selector) {
                rule.style.setProperty(property, value);
                return true;
              }
            }
          }
          return false;
        }
    </script>
</head>
<body>
    <h1>ppaddict+!r</h1>
    <div class="table-container" hx-get="/htmx/beatmaps/initial" hx-trigger="load">
        Loading beatmaps...
    </div>
</body>

</html>
