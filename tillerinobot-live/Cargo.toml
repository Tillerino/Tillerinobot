[package]
name = "ppaddict_live"
# We're getting the version from the first line of CHANGELOG.md to keep the Cargo.toml file constant.
# This allows us to cache the building of dependencies in our Docker images.
# i.e. don't change this version
version = "0.1.0"
authors = ["Tillerino <tillmann.gaida@gmail.com>"]
edition = '2021'

[dependencies]
lapin = { version = "4", default-features = false, features = [ "tokio" ] }
tokio = { version = "1.2", features = [ "rt-multi-thread", "macros", "net" ] }
tokio-stream = { version = "0.1", default-features = false }
serde_derive = { version = "1.0" }
serde_json = { version = "1.0" }
serde = { version = "1.0" }
sha2 = "0.11"
rand_chacha = "0.10"
rand_core = "0.10"
getrandom = { version = "0.4", features = [ "sys_rng" ] }
lazy_static = "1.4"
futures-util = "0.3"
axum = { version = "0.8", default-features = false, features = [ "http1", "tokio", "ws" ] }
futures-macro = { version = "0.3" }
urlencoding = "2"

[[bin]]
name = "main"
path = "src/main/rust/main.rs"
